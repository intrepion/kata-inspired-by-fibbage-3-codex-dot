name: Publish solo game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: kata-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: node scripts/verify-arcade.mjs
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - name: Test solo browser match
        run: |
          python3 -m http.server 4318 --bind 127.0.0.1 --directory dist-pages > /tmp/velvet-pages.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 40); do curl --fail --silent http://127.0.0.1:4318/ > /dev/null && break; sleep 0.25; done
          node test/solo-browser.mjs
      - uses: actions/configure-pages@v5.0.0
      - uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
